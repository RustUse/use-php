[workspace]
members = [
    "crates/use-php",
    "crates/use-php-version",
    "crates/use-php-token",
    "crates/use-php-syntax",
    "crates/use-php-symbol",
    "crates/use-php-namespace",
    "crates/use-php-type",
    "crates/use-php-attribute",
    "crates/use-php-docblock",
    "crates/use-php-ini",
    "crates/use-php-error",
    "crates/use-php-autoload",
    "crates/use-composer-json",
    "crates/use-packagist",
    "crates/use-psr",
    "crates/use-php-extension",
    "crates/use-wordpress",
    "crates/use-wordpress-hook",
    "crates/use-wordpress-block",
    "crates/use-drupal",
    "crates/use-laravel",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
documentation = "https://rustuse.org"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-php"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.dependencies]
use-composer-json = { version = "0.0.1", path = "crates/use-composer-json" }
use-drupal = { version = "0.0.1", path = "crates/use-drupal" }
use-laravel = { version = "0.0.1", path = "crates/use-laravel" }
use-packagist = { version = "0.0.1", path = "crates/use-packagist" }
use-php-attribute = { version = "0.0.1", path = "crates/use-php-attribute" }
use-php-autoload = { version = "0.0.1", path = "crates/use-php-autoload" }
use-php-docblock = { version = "0.0.1", path = "crates/use-php-docblock" }
use-php-error = { version = "0.0.1", path = "crates/use-php-error" }
use-php-extension = { version = "0.0.1", path = "crates/use-php-extension" }
use-php-ini = { version = "0.0.1", path = "crates/use-php-ini" }
use-php-namespace = { version = "0.0.1", path = "crates/use-php-namespace" }
use-php-symbol = { version = "0.0.1", path = "crates/use-php-symbol" }
use-php-syntax = { version = "0.0.1", path = "crates/use-php-syntax" }
use-php-token = { version = "0.0.1", path = "crates/use-php-token" }
use-php-type = { version = "0.0.1", path = "crates/use-php-type" }
use-php-version = { version = "0.0.1", path = "crates/use-php-version" }
use-php = { version = "0.0.1", path = "crates/use-php" }
use-psr = { version = "0.0.1", path = "crates/use-psr" }
use-wordpress-block = { version = "0.0.1", path = "crates/use-wordpress-block" }
use-wordpress-hook = { version = "0.0.1", path = "crates/use-wordpress-hook" }
use-wordpress = { version = "0.0.1", path = "crates/use-wordpress" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
expect_used = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
new_without_default = "allow"
option_if_let_else = "allow"
return_self_not_must_use = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
use_self = "allow"

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-php-version",
    "use-php-token",
    "use-php-syntax",
    "use-php-symbol",
    "use-php-namespace",
    "use-php-type",
    "use-php-attribute",
    "use-php-docblock",
    "use-php-ini",
    "use-php-error",
    "use-php-autoload",
    "use-composer-json",
    "use-packagist",
    "use-psr",
    "use-php-extension",
    "use-wordpress",
    "use-wordpress-hook",
    "use-wordpress-block",
    "use-drupal",
    "use-laravel",
    "use-php",
]
